# nginx server block for scrapex.site -> Next.js on 127.0.0.1:3300
# Install: sudo cp deploy/nginx/scrapex.site.conf /etc/nginx/sites-available/scrapex.site
#          sudo ln -s /etc/nginx/sites-available/scrapex.site /etc/nginx/sites-enabled/
#          sudo nginx -t && sudo systemctl reload nginx
# TLS:     sudo certbot --nginx -d scrapex.site -d www.scrapex.site --redirect
#          (moves this block to 443 and adds an http -> https redirect block)
# Next.js already sends "immutable" cache headers for /_next/static, so nginx adds none.

server {
    listen 80;
    listen [::]:80;
    server_name scrapex.site www.scrapex.site;

    location / {
        proxy_pass http://127.0.0.1:3300;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
