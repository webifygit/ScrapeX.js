# nginx config for scrapex.site. Canonical address: https://www.scrapex.site
# Plain http and the bare domain both 301 there, keeping path and query.
# App: Next.js under PM2 "scrapex" on 127.0.0.1:3300, see deploy/ecosystem.config.cjs.
# TLS: Let's Encrypt cert "scrapex.site" covering both names, renewed by certbot.timer.
#
# Fresh server: get the certificate first, then install this file.
#   sudo certbot certonly --nginx -d scrapex.site -d www.scrapex.site
#   sudo cp deploy/nginx/scrapex.site.conf /etc/nginx/sites-available/scrapex.site
#   sudo ln -sf /etc/nginx/sites-available/scrapex.site /etc/nginx/sites-enabled/scrapex.site
#   sudo nginx -t && sudo systemctl reload nginx

# Plain http, both names: send to https://www
server {
    listen 80;
    listen [::]:80;
    server_name scrapex.site www.scrapex.site;
    return 301 https://www.scrapex.site$request_uri;
}

# https on the bare domain: send to https://www
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name scrapex.site;

    ssl_certificate /etc/letsencrypt/live/scrapex.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/scrapex.site/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://www.scrapex.site$request_uri;
}

# https://www.scrapex.site: the site itself
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.scrapex.site;

    ssl_certificate /etc/letsencrypt/live/scrapex.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/scrapex.site/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://127.0.0.1:3300;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
