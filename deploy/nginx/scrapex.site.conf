# nginx server block for scrapex.site -> Next.js on 127.0.0.1:3100
# Install: sudo cp deploy/nginx/scrapex.site.conf /etc/nginx/sites-available/scrapex.site
#          sudo ln -s /etc/nginx/sites-available/scrapex.site /etc/nginx/sites-enabled/
#          sudo nginx -t && sudo systemctl reload nginx
# TLS:     sudo certbot --nginx -d scrapex.site -d www.scrapex.site   (adds the 443 block)

server {
    listen 80;
    listen [::]:80;
    server_name scrapex.site www.scrapex.site;

    # Hashed build assets never change; cache them for a year.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3100;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
